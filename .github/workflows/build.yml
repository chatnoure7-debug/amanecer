name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Clave de firma fija (para que las actualizaciones se instalen encima)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          if [ ! -f app/amanecer.keystore.b64 ]; then
            keytool -genkeypair -keystore "$RUNNER_TEMP/amanecer.jks" -storetype JKS -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Amanecer, O=Personal"
            base64 -w0 "$RUNNER_TEMP/amanecer.jks" > app/amanecer.keystore.b64
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/amanecer.keystore.b64
            git commit -m "Clave de firma fija para las actualizaciones [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Compilar APK de depuración
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: amanecer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK en Releases (enlace público de descarga)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk amanecer.apk
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest amanecer.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Amanecer (APK)" --notes "APK de depuración listo para instalar en Android."

      - name: Tests (curva de volumen, sintetizador y horarios)
        continue-on-error: true
        run: gradle testDebugUnitTest --no-daemon
