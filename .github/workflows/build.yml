name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar APK de depuración
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: amanecer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK en Releases (enlace público de descarga)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk amanecer.apk
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest amanecer.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Amanecer (APK)" --notes "APK de depuración listo para instalar en Android."

      - name: Tests (curva de volumen, sintetizador y horarios)
        continue-on-error: true
        run: gradle testDebugUnitTest --no-daemon
